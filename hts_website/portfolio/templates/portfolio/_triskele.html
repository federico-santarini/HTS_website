{# Il triskele (triskele.svg): tre tracciati, ognuno con pathLength="1" (serve a disegnarli con stroke-dashoffset, come il trim paths). #}
{# Usato dall'intro (_intro.html: solo disegno, senza link) e dalla home (home.html: ogni tracciato è un link). #}
{# Parametri: css_class (classe dello <svg>); link1/link2/link3 e label1/label2/label3, facoltativi (se manca link<N> quel tracciato è solo disegno). #}
{# Ordine dei tracciati: 1 = quello in alto, 2 = in basso a sinistra, 3 = in basso a destra. I "d" sono scritti una volta sola, qui. #}
{% with d1="M228.5,167.7c-4.5-8.5,3.4-18.5,12.8-18.5c10.1,0,18.8,10,18.8,20.2c0,11.6-13.3,24.1-24.8,25.5 c-12,1.4-30.5-10.5-34.2-29.9c-4.6-24.9,22-43.2,39.9-44.1c18.2-1,49.9,15.4,49.9,50.9c0,18.9-19.5,55-55.1,55 c-35.3,0-67.9-26.2-67.9-65.3c0-30.1,22.9-74.9,77.2-74.9c36,0,80.6,31.5,80.6,88c0,49-46.5,87.8-87.4,87.8 c-33.5,0-42.6-14.5-76.1-15.7" d2="M162,344.2c-2.8,9.2-15.5,10.6-22.1,4c-7.2-7.2-6.2-20.4,1-27.6c8.2-8.2,26.4-7.7,35.6-0.5 c9.5,7.5,14.2,29,3,45.3c-14.3,20.9-46.1,15-59.4,3c-13.6-12.2-24.4-46.1,0.7-71.2c13.4-13.4,52.7-25.1,77.9,0.1 c24.9,24.9,29.5,66.6,1.9,94.2c-21.3,21.3-69.2,36.8-107.6-1.6c-25.4-25.4-34.7-79.3,5.2-119.2c34.6-34.6,95-29.3,123.9-0.3 c23.7,23.7,26.7,36,30.9,62.7" d3="M347.8,313.3c8.5-4.5,18.5,3.4,18.5,12.8c0,10.1-10,18.8-20.2,18.8c-11.6,0-24.1-13.3-25.5-24.8 c-1.4-12,10.5-30.5,29.9-34.2c24.9-4.6,43.2,22,44.1,39.9c1,18.2-15.4,49.9-50.9,49.9c-18.9,0-55-19.5-55-55.1 c0-35.3,26.2-67.9,65.3-67.9c30.1,0,74.9,22.9,74.9,77.2c0,36-31.5,80.6-88,80.6c-49,0-87.8-46.5-87.8-87.4 c0-33.5,12.5-59.8,32.2-76.1" %}
<svg class="{{ css_class }}" viewBox="0 0 500 500"{% if not link1 %} aria-hidden="true" focusable="false"{% endif %}>
    {# Con il link: ogni tracciato è composto da tre strati: .triskele-glow (il bagliore viola, sfocato, visibile solo con hover o focus), #}
    {# .triskele-hit (trasparente e più largo: rende più facile cliccare) e .triskele-line (il tratto bianco visibile). #}
    {% if link1 %}
    {# Sfocatura del bagliore. stdDeviation = quanto si sfuma (in unità del disegno, che è largo 500): più alto = bagliore più morbido e più largo. #}
    {# Un filtro SVG e non il CSS "filter: blur()": Safari non applica quest'ultimo agli elementi dentro un SVG. L'area (x, y, width, height) va tenuta ampia o il bagliore si taglia. #}
    <defs><filter id="triskele-glow-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter></defs>
    {% endif %}
    {% if link1 %}<a class="triskele-link triskele-link-1" href="{{ link1 }}" aria-label="{{ label1 }}"><title>{{ label1 }}</title><path class="triskele-glow" d="{{ d1 }}"/><path class="triskele-hit" d="{{ d1 }}"/><path class="triskele-line" pathLength="1" d="{{ d1 }}"/></a>{% else %}<path pathLength="1" d="{{ d1 }}"/>{% endif %}
    {% if link2 %}<a class="triskele-link triskele-link-2" href="{{ link2 }}" aria-label="{{ label2 }}"><title>{{ label2 }}</title><path class="triskele-glow" d="{{ d2 }}"/><path class="triskele-hit" d="{{ d2 }}"/><path class="triskele-line" pathLength="1" d="{{ d2 }}"/></a>{% else %}<path pathLength="1" d="{{ d2 }}"/>{% endif %}
    {% if link3 %}<a class="triskele-link triskele-link-3" href="{{ link3 }}" aria-label="{{ label3 }}"><title>{{ label3 }}</title><path class="triskele-glow" d="{{ d3 }}"/><path class="triskele-hit" d="{{ d3 }}"/><path class="triskele-line" pathLength="1" d="{{ d3 }}"/></a>{% else %}<path pathLength="1" d="{{ d3 }}"/>{% endif %}
</svg>
{% endwith %}
